-size="11.5" fill="#2dd4bf" letter-spacing="1.5">02 / WEBSITE AUDIT</text><text x="529" y="66" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="22" fill="#fff">SitePulse</text><text x="529" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">Paste a URL, pick pages to scan, get issues, fixes,</text><text x="529" y="106" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">analytics &amp; a detailed report. Live on Vercel.</text><text x="529" y="130" font-family="Consolas,Menlo,'Courier New',monospace" font-size="10.5" fill="#6b7094" letter-spacing="1">NEXT.JS · TYPESCRIPT · VERCEL</text><rect x="10" y="155" width="485" height="130" rx="16" fill="#0f0e22"/><rect x="10" y="155" width="485" height="130" rx="16" fill="none" stroke="#f472b6" stroke-opacity="0.22"/><rect x="10" y="155" width="5" height="130" rx="2" fill="#f472b6"/><rect x="10" y="155" width="485" height="130" rx="16" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 1110"><animate attributeName="stroke-dashoffset" from="0" to="-1230" dur="9s" repeatCount="indefinite"/></rect><text x="34" y="183" font-family="Consolas,Menlo,'Courier New',monospace" font-size="11.5" fill="#f472b6" letter-spacing="1.5">03 / DATA · HEALTHCARE</text><text x="34" y="211" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="22" fill="#fff">DoctorDataAI</text><text x="34" y="233" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">Collects doctor data from NPPES, LinkedIn &amp; Facebook,</text><text x="34" y="251" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">filters by speciality, Excel import / export.</text><text x="34" y="275" font-family="Consolas,Menlo,'Courier New',monospace" font-size="10.5" fill="#6b7094" letter-spacing="1">DATA COLLECTION · EXCEL</text><rect x="505" y="155" width="485" height="130" rx="16" fill="#0f0e22"/><rect x="505" y="155" width="485" height="130" rx="16" fill="none" stroke="#a78bfa" stroke-opacity="0.22"/><rect x="505" y="155" width="5" height="130" rx="2" fill="#a78bfa"/><rect x="505" y="155" width="485" height="130" rx="16" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 1110"><animate attributeName="stroke-dashoffset" from="0" to="-1230" dur="10s" repeatCount="indefinite"/></rect><text x="529" y="183" font-family="Consolas,Menlo,'Courier New',monospace" font-size="11.5" fill="#a78bfa" letter-spacing="1.5">04 / AGENTIC AI</text><text x="529" y="211" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="22" fill="#fff">AI Article Generator</text><text x="529" y="233" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">Topic + keywords → 4 AI drafts → best 2 refined into</text><text x="529" y="251" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">one humanized final article with AI images.</text><text x="529" y="275" font-family="Consolas,Menlo,'Courier New',monospace" font-size="10.5" fill="#6b7094" letter-spacing="1">AGENTIC AI · AUTOMATION</text><rect x="10" y="300" width="485" height="130" rx="16" fill="#0f0e22"/><rect x="10" y="300" width="485" height="130" rx="16" fill="none" stroke="#2dd4bf" stroke-opacity="0.22"/><rect x="10" y="300" width="5" height="130" rx="2" fill="#2dd4bf"/><rect x="10" y="300" width="485" height="130" rx="16" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 1110"><animate attributeName="stroke-dashoffset" from="0" to="-1230" dur="11s" repeatCount="indefinite"/></rect><text x="34" y="328" font-family="Consolas,Menlo,'Courier New',monospace" font-size="11.5" fill="#2dd4bf" letter-spacing="1.5">05 / AUTOMATION</text><text x="34" y="356" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="22" fill="#fff">Playwright Automation</text><text x="34" y="378" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">Human-like browser automation workflows built with</text><text x="34" y="396" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">Playwright and TypeScript.</text><text x="34" y="420" font-family="Consolas,Menlo,'Courier New',monospace" font-size="10.5" fill="#6b7094" letter-spacing="1">TYPESCRIPT · PLAYWRIGHT</text><rect x="505" y="300" width="485" height="130" rx="16" fill="#0f0e22"/><rect x="505" y="300" width="485" height="130" rx="16" fill="none" stroke="#f472b6" stroke-opacity="0.22"/><rect x="505" y="300" width="5" height="130" rx="2" fill="#f472b6"/><rect x="505" y="300" width="485" height="130" rx="16" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 1110"><animate attributeName="stroke-dashoffset" from="0" to="-1230" dur="12s" repeatCount="indefinite"/></rect><text x="529" y="328" font-family="Consolas,Menlo,'Courier New',monospace" font-size="11.5" fill="#f472b6" letter-spacing="1.5">06 / EDUCATION</text><text x="529" y="356" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="22" fill="#fff">Dyscalculia Learning Tool</text><text x="529" y="378" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">Learning-support tool for children with</text><text x="529" y="396" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#aab0c5">math learning difficulty.</text><text x="529" y="420" font-family="Consolas,Menlo,'Courier New',monospace" font-size="10.5" fill="#6b7094" letter-spacing="1">EDUCATION · ACCESSIBILITY</text></svg>