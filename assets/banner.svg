<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/><stop offset="1" stop-color="#14122b"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#2dd4bf;#f472b6;#a78bfa" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#2dd4bf"><animate attributeName="stop-color" values="#2dd4bf;#f472b6;#a78bfa;#2dd4bf" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a78bfa" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="18" fill="url(#grid)"/>
  <!-- aurora orbs -->
  <g filter="url(#blur)">
    <circle r="90" fill="#a78bfa" opacity="0.45"><animate attributeName="cx" values="150;380;150" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="60;200;60" dur="12s" repeatCount="indefinite"/></circle>
    <circle r="80" fill="#2dd4bf" opacity="0.35"><animate attributeName="cx" values="850;620;850" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="220;70;220" dur="14s" repeatCount="indefinite"/></circle>
    <circle r="60" fill="#f472b6" opacity="0.30"><animate attributeName="cx" values="500;700;500" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="250;40;250" dur="10s" repeatCount="indefinite"/></circle>
  </g>
  <!-- window dots -->
  <g transform="translate(34,30)">
    <circle r="6" fill="#f472b6"/><circle cx="20" r="6" fill="#fbbf24"/><circle cx="40" r="6" fill="#2dd4bf"/>
  </g>
  <text x="500" y="30" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" fill="#8b8fb0">~/eman-fatima — portfolio.py</text>
  <!-- name -->
  <text x="500" y="135" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#txt)" letter-spacing="2">EMAN FATIMA</text>
  <text x="500" y="178" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="20" fill="#c9d1d9">Full Stack · AI Agents · UI/UX</text>
  <!-- code line with blinking cursor -->
  <text x="500" y="226" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="16" fill="#a78bfa">
    <tspan fill="#f472b6">while</tspan> alive: <tspan fill="#2dd4bf">learn()</tspan>; <tspan fill="#2dd4bf">build()</tspan>; <tspan fill="#2dd4bf">ship()</tspan>
    <tspan fill="#2dd4bf">▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
  </text>
</svg>
